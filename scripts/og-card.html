<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Practice — OG card (render at 1200x630)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        width: 1200px;
        height: 630px;
        background: #fafaf9;
        color: #171717;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 28px;
        font-weight: 700;
      }
      .mark {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        background: #4f46e5;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 800;
      }
      h1 {
        font-size: 66px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.06;
        max-width: 980px;
      }
      .sub {
        margin-top: 24px;
        font-size: 26px;
        color: #57534e;
      }
      .strip {
        display: flex;
        gap: 12px;
        font-size: 20px;
        color: #44403c;
      }
      .pill {
        border: 1px solid #d6d3d1;
        border-radius: 999px;
        padding: 8px 18px;
        background: #fff;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 12px;
        background: #4f46e5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <span class="mark">A</span>
        <span>AI Practice</span>
      </div>
      <div>
      <h1>Build real AI skills, one&nbsp;exercise at a time.</h1>
      <p class="sub">36 short lessons · 36 hands-on exercises · free, no account</p>
    </div>
    <div class="strip">
      <span class="pill">Foundations</span>
      <span class="pill">Prompting</span>
      <span class="pill">Research</span>
      <span class="pill">Work</span>
      <span class="pill">Coding</span>
      <span class="pill">Safety</span>
    </div>
      <div class="bar"></div>
    </div>
  </body>
</html>
